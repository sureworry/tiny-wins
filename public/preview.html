<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiny wins — preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, sans-serif;
      background: #0c0c0f;
      color: #c8c4d0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
    }

    p {
      margin: 0;
      font-size: 0.85rem;
      opacity: 0.85;
      text-align: center;
      max-width: 28rem;
      line-height: 1.45;
    }

    .shell {
      width: min(100%, 390px);
      aspect-ratio: 375 / 812;
      max-height: min(90dvh, 812px);
      border-radius: 36px;
      padding: 12px;
      background: linear-gradient(145deg, #2a2830, #121118);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.06),
        0 24px 80px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
    }

    .notch {
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notch::after {
      content: "";
      width: 96px;
      height: 22px;
      border-radius: 12px;
      background: #0a0a0d;
    }

    iframe {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: none;
      border-radius: 26px;
      background: #f5f6f8;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="shell" aria-label="Phone preview frame">
    <div class="notch" aria-hidden="true"></div>
    <iframe
      src="/"
      title="Tiny wins app"
      loading="eager"
      referrerpolicy="no-referrer"
    ></iframe>
  </div>
  <p>
    Embedded app in an iframe (run <code>npm run dev</code>). Same origin as the app — shared storage.
  </p>
</body>
</html>
